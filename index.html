<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイページ</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Serif+Display&display=swap');

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --accent: #4f8ef7;
      --accent2: #a78bfa;
      --text: #e8eaf6;
      --text-muted: #7c83a0;
      --border: rgba(255,255,255,0.08);
      --success: #34d399;
      --error: #f87171;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background-image:
        radial-gradient(ellipse at 20% 20%, rgba(79,142,247,0.12) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 80%, rgba(167,139,250,0.10) 0%, transparent 60%);
    }

    /* ===== LOGIN PAGE ===== */
    #login-page {
      width: 100%;
      max-width: 420px;
      animation: fadeIn 0.6s ease;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 40px;
      text-align: center;
      box-shadow: 0 24px 80px rgba(0,0,0,0.4);
    }

    .login-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 28px;
    }

    .login-title {
      font-family: 'DM Serif Display', serif;
      font-size: 28px;
      font-weight: 400;
      margin-bottom: 8px;
      background: linear-gradient(135deg, var(--text), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .login-subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 36px;
      line-height: 1.6;
    }

    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px 24px;
      background: white;
      color: #333;
      border: none;
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 2px 12px rgba(0,0,0,0.2);
    }

    .google-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }

    .google-btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .security-note {
      margin-top: 24px;
      padding: 12px 16px;
      background: rgba(79,142,247,0.08);
      border: 1px solid rgba(79,142,247,0.2);
      border-radius: 10px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .security-note span {
      color: var(--accent);
    }

    /* ===== MAIN PAGE ===== */
    #main-page {
      display: none;
      width: 100%;
      max-width: 680px;
      animation: fadeIn 0.6s ease;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
      padding: 0 4px;
    }

    .header-left h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 26px;
      font-weight: 400;
      background: linear-gradient(135deg, var(--text), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-left p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid var(--accent);
    }

    .logout-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Noto Sans JP', sans-serif;
    }

    .logout-btn:hover {
      border-color: var(--error);
      color: var(--error);
    }

    /* ===== UPLOAD CARD ===== */
    .upload-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.3);
    }

    .upload-zone {
      border: 2px dashed rgba(79,142,247,0.3);
      border-radius: var(--radius);
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s;
      position: relative;
      background: rgba(79,142,247,0.03);
    }

    .upload-zone:hover, .upload-zone.drag-over {
      border-color: var(--accent);
      background: rgba(79,142,247,0.08);
    }

    .upload-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .upload-icon {
      font-size: 48px;
      margin-bottom: 16px;
      display: block;
    }

    .upload-zone h3 {
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .upload-zone p {
      font-size: 13px;
      color: var(--text-muted);
    }

    .file-types {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .file-type-badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
      background: var(--surface2);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    /* ===== FILE QUEUE ===== */
    #file-queue {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .file-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      background: var(--surface2);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      animation: slideIn 0.3s ease;
    }

    .file-item-icon {
      font-size: 28px;
      flex-shrink: 0;
    }

    .file-item-info {
      flex: 1;
      min-width: 0;
    }

    .file-item-name {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-item-size {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .file-item-status {
      font-size: 12px;
      flex-shrink: 0;
    }

    .status-waiting { color: var(--text-muted); }
    .status-uploading { color: var(--accent); }
    .status-done { color: var(--success); }
    .status-error { color: var(--error); }

    .progress-bar-wrap {
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      margin-top: 6px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 2px;
      width: 0%;
      transition: width 0.3s;
    }

    .remove-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
      border-radius: 6px;
      transition: color 0.2s;
      flex-shrink: 0;
    }
    .remove-btn:hover { color: var(--error); }

    /* ===== UPLOAD BUTTON ===== */
    .upload-btn {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Noto Sans JP', sans-serif;
      display: none;
    }

    .upload-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(79,142,247,0.4);
    }

    .upload-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* ===== TOAST ===== */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      transition: transform 0.3s ease;
      z-index: 1000;
      white-space: nowrap;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
    #toast.success { background: var(--success); color: #0f1117; }
    #toast.error { background: var(--error); color: white; }

    /* ===== ANIMATIONS ===== */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* ===== ACCESS DENIED ===== */
    #denied-page {
      display: none;
      width: 100%;
      max-width: 420px;
      animation: fadeIn 0.6s ease;
    }
    .denied-card {
      background: var(--surface);
      border: 1px solid rgba(248,113,113,0.2);
      border-radius: 24px;
      padding: 48px 40px;
      text-align: center;
    }
    .denied-card h2 {
      font-size: 22px;
      color: var(--error);
      margin-bottom: 12px;
    }
    .denied-card p {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.7;
    }
    .back-btn {
      margin-top: 24px;
      padding: 10px 24px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      cursor: pointer;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 14px;
      transition: all 0.2s;
    }
    .back-btn:hover { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>

<!-- ===== LOGIN PAGE ===== -->
<div id="login-page">
  <div class="login-card">
    <div class="login-icon">🔐</div>
    <h1 class="login-title">マイページ</h1>
    <p class="login-subtitle">Googleアカウントでログインして<br>ファイルをアップロードできます</p>
    <button class="google-btn" onclick="handleLogin()">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Googleでログイン
    </button>
    <div class="security-note">
      🔒 <span>許可されたアカウントのみ</span>アクセス可能です
    </div>
  </div>
</div>

<!-- ===== ACCESS DENIED PAGE ===== -->
<div id="denied-page">
  <div class="denied-card">
    <div style="font-size:48px;margin-bottom:16px">🚫</div>
    <h2>アクセス拒否</h2>
    <p>このメールアドレスはアクセスが許可されていません。<br><br><span id="denied-email" style="color:var(--error)"></span></p>
    <button class="back-btn" onclick="showLogin()">← 戻る</button>
  </div>
</div>

<!-- ===== MAIN PAGE ===== -->
<div id="main-page">
  <div class="header">
    <div class="header-left">
      <h1>マイページ</h1>
      <p id="user-email-display"></p>
    </div>
    <div class="user-info">
      <img id="user-avatar" class="user-avatar" src="" alt="" style="display:none">
      <button class="logout-btn" onclick="handleLogout()">ログアウト</button>
    </div>
  </div>

  <div class="upload-card">
    <div class="upload-zone" id="upload-zone">
      <input type="file" id="file-input" multiple accept=".xlsx,.xls,.pdf,.doc,.docx,.csv,.txt,.png,.jpg,.jpeg">
      <span class="upload-icon">📂</span>
      <h3>ファイルをドロップ または クリックして選択</h3>
      <p>Googleドライブに自動保存されます</p>
      <div class="file-types">
        <span class="file-type-badge">Excel</span>
        <span class="file-type-badge">PDF</span>
        <span class="file-type-badge">Word</span>
        <span class="file-type-badge">CSV</span>
        <span class="file-type-badge">画像</span>
      </div>
    </div>

    <div id="file-queue"></div>

    <button class="upload-btn" id="upload-btn" onclick="uploadAll()">
      ☁️ Googleドライブにアップロード
    </button>
  </div>
</div>

<!-- ===== TOAST ===== -->
<div id="toast"></div>

<script>
  // ===== 設定 =====
  const ALLOWED_EMAILS = ['giasu2009@yahoo.co.jp'];
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbyfPJ--BOSzh3scIFyCKpCk5CMLhDsV5oq7o451vOqpWiNwWXO-PtgEMJxSHfr9oOAQ/exec';
  const CLIENT_ID = '582228965013-oet1mnu4k21hg4b5er7lduraiht9jdp9.apps.googleusercontent.com';

  let currentUser = null;
  let fileQueue = [];

  // ===== Google OAuth =====
  function handleLogin() {
    const client = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: 'email profile',
      callback: (response) => {
        if (response.access_token) {
          fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
            headers: { Authorization: `Bearer ${response.access_token}` }
          })
          .then(r => r.json())
          .then(user => {
            if (ALLOWED_EMAILS.includes(user.email)) {
              currentUser = user;
              showMain();
            } else {
              document.getElementById('denied-email').textContent = user.email;
              showDenied();
            }
          });
        }
      }
    });
    client.requestAccessToken();
  }

  function handleLogout() {
    currentUser = null;
    fileQueue = [];
    document.getElementById('file-queue').innerHTML = '';
    document.getElementById('upload-btn').style.display = 'none';
    showLogin();
  }

  function showLogin() {
    document.getElementById('login-page').style.display = 'block';
    document.getElementById('main-page').style.display = 'none';
    document.getElementById('denied-page').style.display = 'none';
  }

  function showMain() {
    document.getElementById('login-page').style.display = 'none';
    document.getElementById('main-page').style.display = 'block';
    document.getElementById('denied-page').style.display = 'none';
    document.getElementById('user-email-display').textContent = currentUser.email;
    if (currentUser.picture) {
      const av = document.getElementById('user-avatar');
      av.src = currentUser.picture;
      av.style.display = 'block';
    }
  }

  function showDenied() {
    document.getElementById('login-page').style.display = 'none';
    document.getElementById('main-page').style.display = 'none';
    document.getElementById('denied-page').style.display = 'block';
  }

  // ===== ファイル選択 =====
  document.getElementById('file-input').addEventListener('change', function(e) {
    addFiles(Array.from(e.target.files));
    this.value = '';
  });

  const zone = document.getElementById('upload-zone');
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
  zone.addEventListener('drop', e => {
    e.preventDefault();
    zone.classList.remove('drag-over');
    addFiles(Array.from(e.dataTransfer.files));
  });

  function addFiles(files) {
    files.forEach(file => {
      const id = Date.now() + Math.random();
      fileQueue.push({ id, file, status: 'waiting' });
      renderFileItem({ id, file, status: 'waiting' });
    });
    if (fileQueue.length > 0) {
      document.getElementById('upload-btn').style.display = 'block';
    }
  }

  function getFileIcon(name) {
    const ext = name.split('.').pop().toLowerCase();
    if (['xlsx','xls','csv'].includes(ext)) return '📊';
    if (['pdf'].includes(ext)) return '📄';
    if (['doc','docx'].includes(ext)) return '📝';
    if (['png','jpg','jpeg','gif'].includes(ext)) return '🖼️';
    return '📁';
  }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
    return (bytes/1048576).toFixed(1) + ' MB';
  }

  function renderFileItem(item) {
    const queue = document.getElementById('file-queue');
    const div = document.createElement('div');
    div.className = 'file-item';
    div.id = 'file-' + item.id;
    div.innerHTML = `
      <span class="file-item-icon">${getFileIcon(item.file.name)}</span>
      <div class="file-item-info">
        <div class="file-item-name">${item.file.name}</div>
        <div class="file-item-size">${formatSize(item.file.size)}</div>
        <div class="progress-bar-wrap"><div class="progress-bar" id="prog-${item.id}"></div></div>
      </div>
      <span class="file-item-status status-waiting" id="status-${item.id}">待機中</span>
      <button class="remove-btn" onclick="removeFile(${item.id})">×</button>
    `;
    queue.appendChild(div);
  }

  function removeFile(id) {
    fileQueue = fileQueue.filter(f => f.id !== id);
    const el = document.getElementById('file-' + id);
    if (el) el.remove();
    if (fileQueue.length === 0) document.getElementById('upload-btn').style.display = 'none';
  }

  // ===== アップロード =====
  async function uploadAll() {
    const btn = document.getElementById('upload-btn');
    btn.disabled = true;
    btn.textContent = 'アップロード中...';

    let success = 0, failed = 0;

    for (const item of fileQueue) {
      if (item.status === 'done') continue;
      setStatus(item.id, 'uploading', '⬆️ 送信中');
      setProgress(item.id, 30);

      try {
        const base64 = await toBase64(item.file);
        setProgress(item.id, 60);

        const formData = new FormData();
        formData.append('file', base64.split(',')[1]);
        formData.append('filename', item.file.name);
        formData.append('mimeType', item.file.type || 'application/octet-stream');

        const res = await fetch(GAS_URL, { method: 'POST', body: formData });
        const data = await res.json();

        if (data.result === 'success') {
          setProgress(item.id, 100);
          setStatus(item.id, 'done', '✅ 完了');
          item.status = 'done';
          success++;
        } else {
          throw new Error('failed');
        }
      } catch (e) {
        setStatus(item.id, 'error', '❌ エラー');
        item.status = 'error';
        failed++;
      }
    }

    btn.disabled = false;
    btn.textContent = '☁️ Googleドライブにアップロード';

    if (success > 0) showToast(`${success}件のファイルを保存しました！`, 'success');
    if (failed > 0) showToast(`${failed}件のファイルが失敗しました`, 'error');
  }

  function toBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function setStatus(id, cls, text) {
    const el = document.getElementById('status-' + id);
    if (el) {
      el.className = `file-item-status status-${cls}`;
      el.textContent = text;
    }
  }

  function setProgress(id, pct) {
    const el = document.getElementById('prog-' + id);
    if (el) el.style.width = pct + '%';
  }

  // ===== トースト =====
  function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `show ${type}`;
    setTimeout(() => t.className = '', 3000);
  }
</script>
</body>
</html>
